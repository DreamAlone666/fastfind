[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.3.2"

[workspace.dependencies]
# https://crates.io/crates/windows/0.62.2
# > Using a range instead of the default Caret requirements helps avoid duplicate versions
# in downstream graphs and improves resolver flexibility.
windows = ">=0.59, <=0.62"
criterion = "0.8.2"

[package]
name = "fastfind"
version.workspace = true
edition = "2024"
build = "build.rs"

[[bench]]
name = "find"
harness = false

[[bench]]
name = "enum_usn_data"
harness = false

[profile.release]
strip = "symbols"
lto = "thin"

[dependencies]
anyhow = "1.0.94"
fastfind-ntfs = { path = "crates/fastfind-ntfs" }
log = "0.4.22"
memchr = "2.7.4"
opener = { version = "0.7.2", features = ["reveal"] }

[dependencies.windows]
workspace = true
features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"]

[dependencies.eframe]
version = "0.31.0"
default-features = false
features = ["glow"]

[dev-dependencies]
criterion = { workspace = true }

[build-dependencies]
winresource = "0.1.20"
